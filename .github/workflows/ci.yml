name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ 21 ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw verify --batch-mode --no-transfer-progress

  # Every green push to main publishes the current -SNAPSHOT to Maven Central's snapshot
  # repository, so main is always available to try out. A release version is skipped: main
  # carries one briefly between `scripts/release.sh prepare` and `scripts/release.sh next`.
  publish-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish snapshot
        run: |
          VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout --batch-mode)
          case "$VERSION" in
            *-SNAPSHOT)
              echo "Publishing $VERSION"
              ./mvnw deploy -Prelease -DskipTests=true --batch-mode --no-transfer-progress
              ;;
            *)
              echo "Version $VERSION is a release, nothing to publish"
              ;;
          esac
