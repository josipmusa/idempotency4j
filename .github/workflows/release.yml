name: Release

# Runs when a vX.Y.Z tag is pushed. The tag must point at a commit prepared by
# scripts/release.sh prepare, so the poms already carry the release version; the
# check step refuses anything else before Maven Central is touched.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check the release is prepared
        run: scripts/release.sh check "${GITHUB_REF_NAME#v}"

      - name: Verify
        run: ./mvnw verify --batch-mode --no-transfer-progress

      - name: Deploy to Maven Central
        run: |
          ./mvnw deploy -Prelease \
            -DskipTests=true \
            --batch-mode \
            --no-transfer-progress

      - name: Write release notes from the changelog
        run: scripts/release.sh notes "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
