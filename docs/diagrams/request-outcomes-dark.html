<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a request resolves</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · idempotency4j</p>
    <h1>How a request resolves</h1>

    <svg viewBox="0 0 880 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="request-outcomes-dark-title request-outcomes-dark-desc">
      <title id="request-outcomes-dark-title">Request outcomes</title>
      <desc id="request-outcomes-dark-desc">A request carrying an idempotency key is routed by the state the key already holds in the store: a new key runs the handler and stores its response before the body reaches the client; a completed key replays the stored response with an Idempotent-Replayed header when the request body matches, and is rejected with 422 when it does not; and a key another caller still holds past the wait timeout is refused with 409 and a Retry-After header.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- request -> tryAcquire -->
      <line x1="150" y1="240" x2="216" y2="240" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- tryAcquire -> four outcomes -->
      <path d="M 384,240 H 420 Q 428,240 428,232 V 88 Q 428,80 436,80 H 520" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 384,240 H 420 Q 428,240 428,232 V 184 Q 428,176 436,176 H 520" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 384,240 H 420 Q 428,240 428,248 V 296 Q 428,304 436,304 H 520" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 384,240 H 420 Q 428,240 428,248 V 392 Q 428,400 436,400 H 520" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- BRANCH LABELS -->
      <rect x="460" y="60" width="36" height="12" rx="2" fill="#2d3142"/>
      <text x="478" y="69" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW</text>

      <rect x="448" y="156" width="60" height="12" rx="2" fill="#2d3142"/>
      <text x="478" y="165" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMPLETE</text>

      <rect x="442" y="284" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="478" y="293" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MISMATCH</text>

      <rect x="444" y="380" width="68" height="12" rx="2" fill="#2d3142"/>
      <text x="478" y="389" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IN FLIGHT</text>

      <!-- REQUEST -->
      <rect x="40" y="216" width="110" height="48" rx="8" fill="#2d3142"/>
      <rect x="40" y="216" width="110" height="48" rx="8" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
      <text x="95" y="236" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Request</text>
      <text x="95" y="251" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Idempotency-Key</text>

      <!-- TRYACQUIRE -->
      <rect x="216" y="212" width="168" height="56" rx="8" fill="#2d3142"/>
      <rect x="216" y="212" width="168" height="56" rx="8" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
      <text x="300" y="236" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">store.tryAcquire</text>
      <text x="300" y="252" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">blocks up to waitTimeout</text>

      <!-- EXECUTED (focal) -->
      <rect x="520" y="52" width="300" height="56" rx="8" fill="#2d3142"/>
      <rect x="520" y="52" width="300" height="56" rx="8" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
      <text x="540" y="76" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Handler runs, response stored</text>
      <text x="540" y="92" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace">record durable before the body is flushed</text>

      <!-- REPLAYED -->
      <rect x="520" y="148" width="300" height="56" rx="8" fill="#2d3142"/>
      <rect x="520" y="148" width="300" height="56" rx="8" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
      <text x="540" y="172" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Stored response replayed</text>
      <text x="540" y="188" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace">Idempotent-Replayed: true</text>

      <!-- MISMATCH -->
      <rect x="520" y="276" width="300" height="56" rx="8" fill="#2d3142"/>
      <rect x="520" y="276" width="300" height="56" rx="8" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
      <text x="540" y="300" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Rejected</text>
      <text x="540" y="316" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace">422 — same key, different body</text>

      <!-- IN FLIGHT -->
      <rect x="520" y="372" width="300" height="56" rx="8" fill="#2d3142"/>
      <rect x="520" y="372" width="300" height="56" rx="8" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
      <text x="540" y="396" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Refused, try again</text>
      <text x="540" y="412" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace">409 + Retry-After — another caller holds it</text>

      <!-- LEGEND -->
      <line x1="40" y1="452" x2="840" y2="452" stroke="#f5f5f5" stroke-opacity="0.16" stroke-width="0.8"/>
      <text x="40" y="470" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="134" y="462" width="24" height="12" rx="3" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="0.8"/>
      <text x="166" y="470" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HANDLER EXECUTED</text>

      <rect x="330" y="462" width="24" height="12" rx="3" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="362" y="470" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HANDLER NOT RUN</text>

      <text x="560" y="470" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">IN-FLIGHT STATUS IS CONFIGURABLE</text>
    </svg>
  </div>
</body>
</html>
