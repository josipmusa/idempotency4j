<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idempotency record lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · idempotency4j</p>
    <h1>Idempotency record lifecycle</h1>

    <svg viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="record-lifecycle-title record-lifecycle-desc">
      <title id="record-lifecycle-title">Idempotency record lifecycle</title>
      <desc id="record-lifecycle-desc">A record is created in progress when a caller acquires a lease, which a heartbeat keeps extending while the action runs and which the next caller may steal once it expires. The record then either completes with a replayable payload, or is released, which deletes it so the key is absent again and free to be reused. A completed record is purged once its time to live elapses; an abandoned in-progress record is purged only once its time to live has elapsed and its lease has expired too.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- TRANSITIONS (drawn before states) -->
      <!-- start -> IN_PROGRESS -->
      <line x1="78" y1="168" x2="160" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- heartbeat self-loop (inner) -->
      <path d="M 216,136 C 216,96 304,96 304,136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- lease expired, stolen by the next caller (outer, time-driven) -->
      <path d="M 180,136 C 180,48 340,48 340,136" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- IN_PROGRESS -> COMPLETE -->
      <line x1="360" y1="168" x2="456" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- IN_PROGRESS -> absent (release deletes the record) -->
      <path d="M 260,200 V 244 Q 260,252 252,252 H 80 Q 72,252 72,244 V 182" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- COMPLETE -> purged -->
      <path d="M 656,168 H 786" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- abandoned IN_PROGRESS -> purged -->
      <path d="M 340,200 V 308 Q 340,316 348,316 H 792 Q 800,316 800,308 V 184" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- TRANSITION LABELS -->
      <rect x="87" y="148" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="119" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRYACQUIRE</text>

      <rect x="228" y="88" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="97" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HEARTBEAT</text>

      <rect x="200" y="40" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="49" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEASE EXPIRED — STOLEN</text>

      <rect x="376" y="150" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="408" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMPLETE()</text>

      <rect x="108" y="246" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="176" y="255" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE() — ROW DELETED</text>

      <rect x="686" y="150" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="722" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TTL ELAPSED</text>

      <rect x="452" y="310" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="319" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TTL ELAPSED + LEASE EXPIRED</text>

      <!-- ABSENT (start and the state release returns to) -->
      <circle cx="72" cy="168" r="6" fill="#2d3142"/>
      <text x="72" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">absent</text>

      <!-- IN_PROGRESS -->
      <rect x="160" y="136" width="200" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="160" y="136" width="200" height="64" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="260" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IN_PROGRESS</text>
      <text x="260" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lease held</text>

      <!-- COMPLETE (focal) -->
      <rect x="456" y="136" width="200" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="456" y="136" width="200" height="64" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="556" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">COMPLETE</text>
      <text x="556" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">payload replayable</text>

      <!-- END (purged) -->
      <circle cx="800" cy="168" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="800" cy="168" r="5" fill="#2d3142"/>

      <!-- NOTE -->
      <text x="48" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">A failed attempt leaves no trace: the next tryAcquire sees a key that was never used.</text>

      <!-- LEGEND -->
      <line x1="48" y1="384" x2="832" y2="384" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="48" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle cx="142" cy="398" r="5" fill="#2d3142"/>
      <text x="156" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ABSENT</text>

      <circle cx="262" cy="398" r="6" fill="none" stroke="#2d3142" stroke-width="0.8"/>
      <circle cx="262" cy="398" r="3.5" fill="#2d3142"/>
      <text x="278" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PURGED</text>

      <rect x="376" y="392" width="24" height="12" rx="3" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="408" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RECORD STATE</text>

      <rect x="544" y="392" width="24" height="12" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="576" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COMPLETED</text>

      <line x1="688" y1="398" x2="712" y2="398" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="720" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TIME-DRIVEN</text>
    </svg>
  </div>
</body>
</html>
