<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idempotency record lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · idempotency4j</p>
    <h1>Idempotency record lifecycle</h1>

    <svg viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="record-lifecycle-title record-lifecycle-desc">
      <title id="record-lifecycle-title">Idempotency record lifecycle</title>
      <desc id="record-lifecycle-desc">A record is created in progress when a caller acquires a lease, which a heartbeat keeps extending while the action runs and which the next caller may steal once it expires; the record then either completes with a replayable payload or fails and becomes reclaimable, and both terminal states are purged when their time to live elapses.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- TRANSITIONS (drawn before states) -->
      <line x1="78" y1="136" x2="160" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 216,120 C 216,72 304,72 304,120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 304,184 C 304,232 216,232 216,184" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 360,136 H 440 Q 448,136 448,128 V 88 Q 448,80 456,80" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 360,168 H 400 Q 408,168 408,176 V 264 Q 408,272 416,272 H 456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 556,304 V 336 Q 556,344 548,344 H 128 Q 120,344 120,336 V 176 Q 120,168 128,168 H 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 656,80 H 792 Q 800,80 800,88 V 144" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 656,272 H 792 Q 800,272 800,264 V 160" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- TRANSITION LABELS -->
      <rect x="87" y="116" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="119" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRYACQUIRE</text>

      <rect x="228" y="64" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="73" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HEARTBEAT</text>

      <rect x="218" y="230" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="239" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEASE EXPIRED</text>

      <rect x="376" y="102" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="408" y="111" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMPLETE()</text>

      <rect x="344" y="214" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="372" y="223" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE()</text>

      <rect x="306" y="324" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="338" y="333" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECLAIMED</text>

      <rect x="688" y="60" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="724" y="69" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TTL ELAPSED</text>

      <rect x="688" y="252" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="724" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TTL ELAPSED</text>

      <!-- START -->
      <circle cx="72" cy="136" r="6" fill="#2d3142"/>

      <!-- IN_PROGRESS -->
      <rect x="160" y="120" width="200" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="160" y="120" width="200" height="64" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="260" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IN_PROGRESS</text>
      <text x="260" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lease held</text>

      <!-- COMPLETE (focal) -->
      <rect x="456" y="48" width="200" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="456" y="48" width="200" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="556" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">COMPLETE</text>
      <text x="556" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">payload replayable</text>

      <!-- FAILED -->
      <rect x="456" y="240" width="200" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="456" y="240" width="200" height="64" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="556" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FAILED</text>
      <text x="556" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reclaimable</text>

      <!-- END (purged) -->
      <circle cx="800" cy="152" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="800" cy="152" r="5" fill="#2d3142"/>

      <!-- LEGEND -->
      <line x1="48" y1="384" x2="832" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle cx="142" cy="398" r="5" fill="#2d3142"/>
      <text x="156" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">START</text>

      <circle cx="254" cy="398" r="6" fill="none" stroke="#2d3142" stroke-width="0.8"/>
      <circle cx="254" cy="398" r="3.5" fill="#2d3142"/>
      <text x="270" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PURGED</text>

      <rect x="368" y="392" width="24" height="12" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="400" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RECORD STATE</text>

      <rect x="536" y="392" width="24" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="568" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COMPLETED</text>

      <line x1="680" y1="398" x2="704" y2="398" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="712" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TIME-DRIVEN</text>
    </svg>
  </div>
</body>
</html>
